Exercise:
  type: object
  description: Bài tập trong thư viện dùng chung
  required: [id, sourceId, name, primaryMuscles, equipment, instructions, source]
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    sourceId:
      type: string
      description: ID gốc của bài tập trong thư viện nguồn.
    name:
      type: string
    primaryMuscles:
      type: array
      items:
        type: string
    equipment:
      type: string
      nullable: true
    instructions:
      type: array
      items:
        type: string
    source:
      type: string
      description: Nguồn dữ liệu, ghi nguồn và quản lý giấy phép.
ExerciseList:
  allOf:
    - $ref: '../components.yaml#/schemas/PageMeta'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/Exercise'
WorkoutSetCreate:
  type: object
  description: Ghi dữ liệu một hiệp đã thực hiện. Exercise không tồn tại trả 422.
  additionalProperties: false
  required: [exerciseId, reps, weightKg]
  properties:
    exerciseId:
      type: string
      format: uuid
      description: UUID của Exercise.
    reps:
      type: integer
      minimum: 1
    weightKg:
      type: number
      minimum: 0
      description: Khối lượng tạ bên ngoài, không tính bodyweight. Nếu bài tập không dùng tạ, ghi 0.
    rpe:
      type: number
      minimum: 1
      maximum: 10
      nullable: true
WorkoutSet:
  type: object
  required: [id, sessionId, exerciseId, setNumber, reps, weightKg, createdAt]
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    sessionId:
      type: string
      format: uuid
      readOnly: true
    exerciseId:
      type: string
      format: uuid
    setNumber:
      type: integer
      minimum: 1
      readOnly: true
      description: Thứ tự hiệp trong buổi tập, server tự cấp.
    reps:
      type: integer
      minimum: 1
    weightKg:
      type: number
      minimum: 0
    rpe:
      type: number
      minimum: 1
      maximum: 10
      nullable: true
    createdAt:
      type: string
      format: date-time
      readOnly: true
WorkoutSessionCreate:
  type: object
  additionalProperties: false
  required:
    - title
    - startedAt
  description: Ghi một buổi đã bắt đầu. UC5 tạo buổi dự kiến qua nghiệp vụ nội bộ, không tạo hiệp thực hiện giả.
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 120
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
      nullable: true
      description: Nếu có, phải >= startedAt. Backend kiểm điều kiện này.
    note:
      type: string
      nullable: true
      maxLength: 1000
WorkoutSessionPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  description: Chỉ trường gửi lên được đổi. Không ghi đè sets hoặc quyền sở hữu. Backend kiểm endedAt >= startedAt.
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 120
    startedAt:
      type: string
      format: date-time
      description: Ghi thời điểm bắt đầu thực tế cho buổi dự kiến, hoặc sửa thời gian ghi nhận.
    endedAt:
      type: string
      format: date-time
      nullable: true
    note:
      type: string
      nullable: true
      maxLength: 1000
WorkoutSession:
  type: object
  description: >-
    Một buổi thuộc người dùng hiện tại. Buổi dự kiến từ UC5 có scheduledAt, startedAt=null và sets rỗng.
    PATCH startedAt khi bắt đầu thực tế.
  required:
    - id
    - title
    - startedAt
    - scheduledAt
    - endedAt
    - source
    - sets
    - totalVolumeKg
    - version
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    title:
      type: string
    startedAt:
      type: string
      format: date-time
      nullable: true
    scheduledAt:
      type: string
      format: date-time
      nullable: true
      readOnly: true
    endedAt:
      type: string
      format: date-time
      nullable: true
    note:
      type: string
      nullable: true
    source:
      type: string
      enum:
        - manual
        - week-plan
      readOnly: true
    sets:
      type: array
      items:
        $ref: '#/WorkoutSet'
      description: Hiệp thực hiện thật; rỗng khi mới tạo hoặc mới nhận kế hoạch.
    totalVolumeKg:
      type: number
      minimum: 0
      readOnly: true
      description: Tổng reps × weightKg của hiệp đã ghi, đơn vị kg. Code tính, không lưu cột tổng và không dùng LLM.
    version:
      type: integer
      minimum: 1
      readOnly: true
      description: Phiên bản buổi tập, tăng khi sửa buổi hoặc thêm hiệp. Dùng để tạo ETag.
    createdAt:
      type: string
      format: date-time
      readOnly: true
    updatedAt:
      type: string
      format: date-time
      readOnly: true
WorkoutSessionList:
  allOf:
    - $ref: ../components.yaml#/schemas/PageMeta
    - type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/WorkoutSession'
