openapi: 3.0.3
info:
  title: UP API
  version: 1.0.0
  description: |
    API của UP: công việc, tập luyện, dinh dưỡng và kịch bản tuần do BYOAI (hoặc Mock Provider) đề xuất.

    Quy ước chung (xem `docs` của dự án):
    - Lỗi dùng RFC 7807 (`application/problem+json`).
    - Danh sách dùng `page`, `size`, `sort`; trả `items`, `page`, `size`, `total`.
    - Cập nhật dùng `ETag` ở GET và `If-Match` ở PATCH/PUT.
    - Xác thực bằng JWT Bearer. Tài nguyên của người khác trả 404.
    - Phiên bản nằm trong đường dẫn (`/api/v1`).

    Hợp đồng viết tay là nguồn sự thật; OpenAPI do FastAPI sinh phải được đối chiếu
    (lỗi RFC 7807, alias camelCase, mã HTTP, ETag, security).

    Cấu trúc file: mỗi người giữ một file trong `paths/`, schema riêng trong `schemas/`,
    phần dùng chung trong `components.yaml`.
servers:
  - url: http://127.0.0.1:4010
    description: Mock server (Prism, không có tiền tố /api/v1)
  - url: http://localhost:8000/api/v1
    description: Backend FastAPI chạy local (Uvicorn)
tags:
  - name: auth
    description: Đăng ký, đăng nhập, đổi token
  - name: users
    description: Người dùng hiện tại
  - name: tasks
    description: Công việc
  - name: events
    description: Sự kiện trong lịch
  - name: exercises
    description: Thư viện bài tập (chỉ đọc)
  - name: workout-sessions
    description: Buổi tập và các hiệp
  - name: foods
    description: Thực phẩm (chỉ đọc)
  - name: meal-logs
    description: Nhật ký ăn
  - name: nutrition
    description: Hồ sơ và mục tiêu dinh dưỡng
  - name: week-plans
    description: Kịch bản tuần do BYOAI hoặc Mock Provider đề xuất, người dùng xác nhận
security:
  - bearerAuth: []
paths:
  # --- Cảnh: identity, planner ---
  /auth/register:
    $ref: './paths/auth-planner.yaml#/~1auth~1register'
  /auth/login:
    $ref: './paths/auth-planner.yaml#/~1auth~1login'
  /auth/refresh:
    $ref: './paths/auth-planner.yaml#/~1auth~1refresh'
  /users/me:
    $ref: './paths/auth-planner.yaml#/~1users~1me'
  /tasks:
    $ref: './paths/auth-planner.yaml#/~1tasks'
  /tasks/{id}:
    $ref: './paths/auth-planner.yaml#/~1tasks~1%7Bid%7D'
  /events:
    $ref: './paths/auth-planner.yaml#/~1events'
  # --- Dũng: fitness ---
  /exercises:
    $ref: './paths/fitness.yaml#/~1exercises'
  /workout-sessions:
    $ref: './paths/fitness.yaml#/~1workout-sessions'
  /workout-sessions/{id}/sets:
    $ref: './paths/fitness.yaml#/~1workout-sessions~1%7Bid%7D~1sets'
  # --- Hiếu: nutrition, week-plans ---
  /foods:
    $ref: './paths/nutrition-plans.yaml#/~1foods'
  /meal-logs:
    $ref: './paths/nutrition-plans.yaml#/~1meal-logs'
  /nutrition-profile:
    $ref: './paths/nutrition-plans.yaml#/~1nutrition-profile'
  /nutrition-profile/targets:
    $ref: './paths/nutrition-plans.yaml#/~1nutrition-profile~1targets'
  /week-plans:
    $ref: './paths/nutrition-plans.yaml#/~1week-plans'
  /week-plans/{id}:
    $ref: './paths/nutrition-plans.yaml#/~1week-plans~1%7Bid%7D'
  /week-plans/{id}:accept:
    $ref: './paths/nutrition-plans.yaml#/~1week-plans~1%7Bid%7D:accept'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token lấy từ `POST /auth/login`.
