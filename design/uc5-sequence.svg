<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="sq-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="sq-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#15803d" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="960" height="650" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" fill="#111111" font-size="16" font-weight="bold">Sequence Diagram — Luồng Demo Trọng Tâm UC5 (FastAPI · BYOAI · Mock Provider)</text>

  <!-- Lifeline Headers -->
  <rect x="35" y="46" width="160" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="72" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">Người dùng / Frontend</text>

  <rect x="265" y="46" width="170" height="42" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">FastAPI (/api/v1 · plans)</text>

  <rect x="505" y="46" width="180" height="42" rx="4" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="595" y="72" text-anchor="middle" fill="#312e81" font-size="12" font-weight="bold">BYOAI / Mock Provider</text>

  <rect x="755" y="46" width="165" height="42" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="837" y="72" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">PostgreSQL &amp; Modules</text>

  <!-- Lifelines -->
  <line x1="115" y1="88" x2="115" y2="620" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,5"/>
  <line x1="350" y1="88" x2="350" y2="620" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,5"/>
  <line x1="595" y1="88" x2="595" y2="620" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,5"/>
  <line x1="837" y1="88" x2="837" y2="620" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,5"/>

  <!-- 1. Login -->
  <line x1="115" y1="120" x2="343" y2="120" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sq-solid)"/>
  <text x="232" y="114" text-anchor="middle" fill="#0f172a" font-size="11">1. POST /auth/login { email, password }</text>
  <line x1="343" y1="145" x2="122" y2="145" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sq-open)"/>
  <text x="232" y="139" text-anchor="middle" fill="#15803d" font-size="11">200 OK { accessToken, refreshToken }</text>

  <!-- 2. POST /week-plans -->
  <line x1="115" y1="180" x2="343" y2="180" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sq-solid)"/>
  <text x="232" y="174" text-anchor="middle" fill="#0f172a" font-size="11">2. POST /week-plans { weekStart, mode, goals }</text>

  <line x1="350" y1="206" x2="830" y2="206" stroke="#1e293b" stroke-width="1.4" marker-end="url(#sq-solid)"/>
  <text x="595" y="200" text-anchor="middle" fill="#334155" font-size="11">Đọc lịch hiện tại + tính BMR/TDEE bằng code · Lưu WEEK_PLAN (status="pending")</text>

  <line x1="343" y1="234" x2="122" y2="234" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sq-open)"/>
  <text x="232" y="228" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">202 Accepted { id, status: "pending", ETag: "1" }</text>

  <!-- 3. GET /week-plans/{id} -->
  <line x1="115" y1="270" x2="343" y2="270" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sq-solid)"/>
  <text x="232" y="264" text-anchor="middle" fill="#0f172a" font-size="11">3. GET /week-plans/{id}</text>

  <line x1="350" y1="296" x2="588" y2="296" stroke="#4338ca" stroke-width="1.4" marker-end="url(#sq-solid)"/>
  <text x="472" y="290" text-anchor="middle" fill="#312e81" font-size="11">Mock: trả bản nháp cố định ("draft") | Xuất/Nhập: dựng prompt tối giản ("awaiting-input")</text>

  <line x1="343" y1="322" x2="122" y2="322" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sq-open)"/>
  <text x="232" y="316" text-anchor="middle" fill="#15803d" font-size="11">200 OK (status: "draft" hoặc "awaiting-input" kèm exportPrompt)</text>

  <!-- 4. Optional BYOAI :import -->
  <rect x="45" y="338" width="870" height="80" rx="6" fill="#eff6ff" fill-opacity="0.7" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="58" y="356" fill="#1d4ed8" font-size="11" font-weight="bold">4. [Đề xuất BYOAI — CHỜ NHÓM GÓP Ý] Nếu status = "awaiting-input": người dùng dán prompt sang AI cá nhân rồi nhập JSON</text>
  <line x1="115" y1="378" x2="343" y2="378" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#sq-solid)"/>
  <text x="232" y="372" text-anchor="middle" fill="#1e3a8a" font-size="11">POST /week-plans/{id}:import (JSON từ AI cá nhân)</text>
  <line x1="350" y1="398" x2="830" y2="398" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#sq-solid)"/>
  <text x="595" y="392" text-anchor="middle" fill="#1e40af" font-size="11">Kiểm Pydantic, quyền sở hữu, ID tham chiếu &amp; ràng buộc -&gt; Hợp lệ mới chuyển "draft" (sai trả 422)</text>

  <!-- 5. POST /week-plans/{id}:accept -->
  <line x1="115" y1="454" x2="343" y2="454" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sq-solid)"/>
  <text x="232" y="448" text-anchor="middle" fill="#0f172a" font-size="11">5. POST /week-plans/{id}:accept (If-Match: "1", itemIds)</text>

  <line x1="350" y1="482" x2="830" y2="482" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sq-solid)"/>
  <text x="595" y="476" text-anchor="middle" fill="#334155" font-size="11">Kiểm quyền, ETag, trùng giờ -&gt; Transaction tạo TASK, WORKOUT_SESSION, MEAL_LOG (mỗi mục 1 lần)</text>

  <line x1="343" y1="510" x2="122" y2="510" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sq-open)"/>
  <text x="232" y="504" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">200 OK { status: "accepted", createdResources } (retry không tạo trùng)</text>

  <!-- Error note box -->
  <rect x="35" y="534" width="890" height="72" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="480" y="554" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">Các ca lỗi chuẩn RFC 7807 (application/problem+json) &amp; Xử lý thất bại:</text>
  <text x="480" y="572" text-anchor="middle" fill="#b91c1c" font-size="11">• 401 (thiếu JWT) · 404 (không có plan hoặc khác chủ) · 409 (sai trạng thái / đang pending / đã nhận) · 412 (If-Match cũ)</text>
  <text x="480" y="590" text-anchor="middle" fill="#b91c1c" font-size="11">• 422 (lỗi Pydantic / trùng giờ lịch) · 429 (quá giới hạn tốc độ + Retry-After) · Xử lý lỗi -&gt; status="failed" có lý do để thử lại</text>
</svg>
