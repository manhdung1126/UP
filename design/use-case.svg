<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="uc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="960" height="610" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" fill="#111111" font-size="16" font-weight="bold">Use Case Diagram — Hệ thống UP (FastAPI · BYOAI · Ranh giới MVP)</text>

  <!-- System Boundary: MVP -->
  <rect x="200" y="46" width="500" height="346" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="450" y="68" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">Hệ thống UP — Phạm vi MVP Bắt buộc (Tuần 12–15)</text>

  <!-- Extension Boundary: Cho nhom gop y -->
  <rect x="200" y="404" width="500" height="86" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="424" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">Mở rộng [CHỜ NHÓM GÓP Ý] (Chỉ làm khi lõi MVP đạt)</text>

  <!-- Out of Scope Boundary -->
  <rect x="200" y="502" width="500" height="92" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="522" text-anchor="middle" fill="#b45309" font-size="12" font-weight="bold">Ngoài phạm vi MVP (Định hướng Super App dài hạn)</text>

  <!-- Actor: Nguoi dung (Left) -->
  <g transform="translate(82, 195)">
    <circle cx="0" cy="-35" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="0" y1="-21" x2="0" y2="18" stroke="#111111" stroke-width="2"/>
    <line x1="-22" y1="-8" x2="22" y2="-8" stroke="#111111" stroke-width="2"/>
    <line x1="0" y1="18" x2="-18" y2="46" stroke="#111111" stroke-width="2"/>
    <line x1="0" y1="18" x2="18" y2="46" stroke="#111111" stroke-width="2"/>
    <text x="0" y="66" text-anchor="middle" fill="#111111" font-size="13" font-weight="bold">Người dùng</text>
    <text x="0" y="82" text-anchor="middle" fill="#555555" font-size="11">(Frontend UP)</text>
  </g>

  <!-- External Actors (Right): BYOAI & Mock Provider -->
  <rect x="755" y="252" width="175" height="62" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="842" y="276" text-anchor="middle" fill="#312e81" font-size="11" font-weight="bold">&lt;&lt;BYOAI — Không API trả phí&gt;&gt;</text>
  <text x="842" y="294" text-anchor="middle" fill="#1e1b4b" font-size="12" font-weight="bold">Trợ lý AI của người dùng</text>
  <text x="842" y="308" text-anchor="middle" fill="#4338ca" font-size="10">(Xuất prompt / Nhập JSON)</text>

  <rect x="755" y="328" width="175" height="52" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="842" y="350" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">Mock Provider</text>
  <text x="842" y="366" text-anchor="middle" fill="#166534" font-size="10">(Bắt buộc cho demo &amp; CI test)</text>

  <!-- Use Cases Inside MVP -->
  <ellipse cx="355" cy="108" rx="125" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="355" y="112" text-anchor="middle" fill="#111111" font-size="12">UC1: Đăng ký, đăng nhập (JWT)</text>

  <ellipse cx="355" cy="162" rx="125" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="355" y="166" text-anchor="middle" fill="#111111" font-size="12">UC2: Quản lý công việc &amp; lịch</text>

  <ellipse cx="355" cy="216" rx="125" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="355" y="220" text-anchor="middle" fill="#111111" font-size="12">UC3: Ghi buổi tập &amp; 939 bài tập</text>

  <ellipse cx="355" cy="270" rx="125" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="355" y="274" text-anchor="middle" fill="#111111" font-size="12">UC4: Ghi bữa ăn &amp; tính Kcal/Macro</text>

  <!-- Highlighted UC5 -->
  <ellipse cx="355" cy="340" rx="130" ry="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="355" y="336" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">UC5: Lên kịch bản tuần (BYOAI)</text>
  <text x="355" y="353" text-anchor="middle" fill="#1d4ed8" font-size="10">(Demo trọng tâm · Kiểm Pydantic)</text>

  <!-- Sub Use Case: Accept Draft -->
  <ellipse cx="600" cy="262" rx="84" ry="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="259" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">Xác nhận bản nháp</text>
  <text x="600" y="274" text-anchor="middle" fill="#1d4ed8" font-size="10">(:accept · Transaction)</text>

  <!-- Extension Use Cases -->
  <ellipse cx="330" cy="458" rx="112" ry="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="330" y="462" text-anchor="middle" fill="#1e40af" font-size="11">PoC Virtual Trainer (1–2 bài)</text>

  <ellipse cx="570" cy="458" rx="114" ry="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="570" y="462" text-anchor="middle" fill="#1e40af" font-size="11">Connector chính thức / MCP / Local</text>

  <!-- Out of Scope Use Cases -->
  <ellipse cx="290" cy="558" rx="74" ry="22" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="290" y="562" text-anchor="middle" fill="#92400e" font-size="11">Thu chi &amp; nhập CSV</text>

  <ellipse cx="450" cy="558" rx="72" ry="22" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="450" y="562" text-anchor="middle" fill="#92400e" font-size="11">Học tập &amp; Flashcard</text>

  <ellipse cx="610" cy="558" rx="76" ry="22" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="610" y="562" text-anchor="middle" fill="#92400e" font-size="11">Camera Web đầy đủ</text>

  <!-- Associations from User -->
  <line x1="112" y1="188" x2="230" y2="108" stroke="#333333" stroke-width="1.5"/>
  <line x1="112" y1="196" x2="230" y2="162" stroke="#333333" stroke-width="1.5"/>
  <line x1="112" y1="204" x2="230" y2="216" stroke="#333333" stroke-width="1.5"/>
  <line x1="112" y1="212" x2="230" y2="270" stroke="#333333" stroke-width="1.5"/>
  <line x1="112" y1="220" x2="225" y2="340" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Include from UC5 to Accept -->
  <line x1="468" y1="322" x2="544" y2="282" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#uc-arrow)"/>
  <text x="530" y="316" text-anchor="middle" fill="#1d4ed8" font-size="10">&lt;&lt;include&gt;&gt;</text>

  <!-- Accept creates records in UC2, UC3, UC4 -->
  <line x1="560" y1="240" x2="462" y2="170" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#uc-arrow)"/>
  <line x1="530" y1="248" x2="478" y2="222" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#uc-arrow)"/>
  <line x1="516" y1="264" x2="482" y2="270" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#uc-arrow)"/>

  <!-- Association from UC5 to BYOAI & Mock -->
  <line x1="485" y1="334" x2="755" y2="284" stroke="#4338ca" stroke-width="1.5"/>
  <line x1="485" y1="348" x2="755" y2="354" stroke="#15803d" stroke-width="1.5"/>
</svg>
