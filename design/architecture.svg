<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" fill="#111111" font-size="16" font-weight="bold">Sơ đồ Kiến trúc Hệ thống UP — FastAPI Modular Monolith &amp; BYOAI (/api/v1)</text>

  <!-- Consumers Layer -->
  <rect x="130" y="46" width="320" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="290" y="69" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="bold">Frontend UP mới (JS module, từng slice)</text>
  <text x="290" y="87" text-anchor="middle" fill="#475569" font-size="11">docs/ giữ làm prototype tham khảo</text>

  <rect x="490" y="46" width="320" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="650" y="69" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="bold">Swagger UI / Prism / Newman</text>
  <text x="650" y="87" text-anchor="middle" fill="#475569" font-size="11">Đối chiếu hợp đồng api/openapi.yaml (Design-First)</text>

  <line x1="290" y1="100" x2="290" y2="134" stroke="#334155" stroke-width="1.6" marker-end="url(#arch-arrow)"/>
  <line x1="650" y1="100" x2="650" y2="134" stroke="#334155" stroke-width="1.6" marker-end="url(#arch-arrow)"/>
  <text x="470" y="121" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">HTTPS · Authorization: Bearer &lt;JWT&gt; · ETag / If-Match</text>

  <!-- FastAPI Process Box -->
  <rect x="40" y="138" width="880" height="296" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="60" y="162" fill="#0f172a" font-size="14" font-weight="bold">FastAPI (/api/v1), Uvicorn — Modular Monolith (MVP)</text>

  <!-- Middleware / Exception Handler Bar -->
  <rect x="64" y="174" width="832" height="36" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="197" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Depends(DB Session / JWT) · Pydantic Validation · Exception Handler RFC 7807 · Rate Limit (429 + Retry-After)</text>

  <!-- 5 APIRouters -->
  <rect x="64" y="226" width="152" height="84" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="249" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">APIRouter: identity</text>
  <text x="140" y="269" text-anchor="middle" fill="#475569" font-size="11">/auth/*, /users/me</text>
  <text x="140" y="287" text-anchor="middle" fill="#64748b" font-size="10">(Cảnh)</text>

  <rect x="234" y="226" width="152" height="84" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="249" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">APIRouter: planner</text>
  <text x="310" y="269" text-anchor="middle" fill="#475569" font-size="11">/tasks, /events</text>
  <text x="310" y="287" text-anchor="middle" fill="#64748b" font-size="10">(Cảnh)</text>

  <rect x="404" y="226" width="152" height="84" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="249" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">APIRouter: fitness</text>
  <text x="480" y="269" text-anchor="middle" fill="#475569" font-size="11">/exercises, /workout-sessions</text>
  <text x="480" y="287" text-anchor="middle" fill="#64748b" font-size="10">(Dũng)</text>

  <rect x="574" y="226" width="152" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="249" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">APIRouter: nutrition</text>
  <text x="650" y="269" text-anchor="middle" fill="#78350f" font-size="11">/foods, /meal-logs, /profile</text>
  <text x="650" y="287" text-anchor="middle" fill="#92400e" font-size="10">(Hiếu)</text>

  <rect x="744" y="226" width="152" height="84" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="820" y="249" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">APIRouter: plans</text>
  <text x="820" y="269" text-anchor="middle" fill="#1e40af" font-size="11">/week-plans, :accept</text>
  <text x="820" y="287" text-anchor="middle" fill="#1e40af" font-size="10">(:import đề xuất · Hiếu)</text>

  <!-- Internal Service & BYOAI Layer -->
  <rect x="64" y="336" width="464" height="76" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="296" y="360" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Hàm Dịch vụ Nội bộ &amp; Bộ Kiểm tra bằng Code</text>
  <text x="296" y="380" text-anchor="middle" fill="#475569" font-size="11">• Không đọc/ghi bảng chéo · Gọi nhau qua interface dịch vụ có hợp đồng</text>
  <text x="296" y="398" text-anchor="middle" fill="#475569" font-size="11">• Tính BMR/TDEE (Mifflin-St Jeor), tổng kcal/tập &amp; kiểm trùng giờ lịch</text>

  <rect x="550" y="336" width="346" height="76" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="723" y="360" text-anchor="middle" fill="#312e81" font-size="12" font-weight="bold">Tầng BYOAI (Bring Your Own AI)</text>
  <text x="723" y="380" text-anchor="middle" fill="#4338ca" font-size="11">• Bắt buộc: Mock Provider + Xuất prompt / Nhập JSON</text>
  <text x="723" y="398" text-anchor="middle" fill="#4338ca" font-size="11">• Mở rộng (PoC): Connector chính thức / MCP / Local LLM</text>

  <line x1="820" y1="310" x2="820" y2="334" stroke="#334155" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <line x1="650" y1="310" x2="450" y2="334" stroke="#334155" stroke-width="1.5" marker-end="url(#arch-arrow)"/>

  <!-- DB & BYOAI External -->
  <line x1="296" y1="434" x2="296" y2="466" stroke="#334155" stroke-width="1.8" marker-end="url(#arch-arrow)"/>
  <line x1="723" y1="412" x2="723" y2="466" stroke="#4338ca" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>

  <rect x="64" y="470" width="464" height="58" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
  <text x="296" y="495" text-anchor="middle" fill="#14532d" font-size="13" font-weight="bold">SQLAlchemy 2.x + Alembic -&gt; PostgreSQL</text>
  <text x="296" y="513" text-anchor="middle" fill="#166534" font-size="11">Migration, Transaction &amp; test cạnh tranh chạy PostgreSQL (SQLite chỉ cho unit test)</text>

  <rect x="550" y="470" width="346" height="58" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="723" y="495" text-anchor="middle" fill="#312e81" font-size="12" font-weight="bold">Trợ lý AI của người dùng / Local LLM</text>
  <text x="723" y="513" text-anchor="middle" fill="#4338ca" font-size="11">Không yêu cầu API key trả phí · Không lấy cookie trình duyệt</text>

  <!-- Virtual Trainer PoC Box (Outside Core MVP) -->
  <rect x="40" y="544" width="880" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="566" fill="#b45309" font-size="12" font-weight="bold">Virtual Trainer cục bộ (PoC ngoài lõi MVP — [CHỜ NHÓM GÓP Ý], không upload video lên Backend/LLM)</text>
  <text x="480" y="592" text-anchor="middle" fill="#78350f" font-size="12">Camera -&gt; MediaPipe (33 landmark) -&gt; Góc khớp / RepCounter + SVM -&gt; Tóm tắt hiệp -&gt; Người dùng duyệt -&gt; Fitness API &amp; BYOAI nhận xét sau hiệp</text>
</svg>
